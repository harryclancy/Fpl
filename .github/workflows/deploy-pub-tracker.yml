name: Deploy Dublin Pub Tracker to GitHub Pages

on:
  push:
    branches:
      - claude/dublin-pub-tracker-jkzdm4
      - main
    paths:
      - "pub-tracker/**"
      - ".github/workflows/deploy-pub-tracker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pub-tracker/package-lock.json
      - name: Install dependencies
        working-directory: pub-tracker
        run: npm ci
      - name: Build
        working-directory: pub-tracker
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pub-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
